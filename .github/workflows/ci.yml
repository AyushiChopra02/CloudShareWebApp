name: CloudShare CI/CD

on:
  push:
    branches:
      - main
      - develop
      - feature/app-enhancements

  pull_request:
    branches:
      - main
      - develop

jobs:

  backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: cloudshare
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    defaults:
      run:
        working-directory: cloudShareBackend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and test backend
        env:
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
          CLERK_ISSUER: ${{ secrets.CLERK_ISSUER }}
          CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL }}
        run: mvn verify

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cloudShareFrontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: http://localhost:8080/api
        run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: cloudShareBackend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./cloudShareBackend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cloudshare-backend:latest